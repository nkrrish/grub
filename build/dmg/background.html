<!doctype html>
<!-- The DMG window background. Rendered to PNG by scripts/dmg-background.js; not shipped in the app.
     Layout is in 1x points (660x420); ?scale=2 renders the Retina version. Icons sit at (170, 210) and
     (490, 210), matching scripts/dmg-settings.py. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Fredoka'; src: url('../../node_modules/@fontsource-variable/fredoka/files/fredoka-latin-wght-normal.woff2') format('woff2'); font-weight: 300 700; }
  html, body { margin: 0; background: #14110f; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const S = Number(new URLSearchParams(location.search).get('scale') || 1);
  const W = 660, H = 420, CELL = 9;
  const c = document.getElementById('c');
  c.width = W * S; c.height = H * S; c.style.width = W * S + 'px'; c.style.height = H * S + 'px';
  const g = c.getContext('2d');
  g.scale(S, S);

  // Same value-noise mould as the site's hero, so the DMG feels like part of it.
  const hash = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
  const noise = (x, y) => {
    const ix = Math.floor(x), iy = Math.floor(y); let fx = x - ix, fy = y - iy;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    const a = hash(ix, iy), b = hash(ix + 1, iy), c2 = hash(ix, iy + 1), d = hash(ix + 1, iy + 1);
    return a + (b - a) * fx + (c2 - a) * fy + (a - b - c2 + d) * fx * fy;
  };
  const fbm = (x, y) => { let v = 0, a = 0.5; for (let i = 0; i < 5; i++) { v += a * noise(x, y); x = x * 2.03 + 1.7; y = y * 2.03 + 9.2; a *= 0.5; } return v; };
  const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
  const soil = [91, 70, 54], moss = [107, 133, 48], mold = [184, 227, 77];
  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

  // Night soil: a dark top that warms toward the mound.
  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#14110f'); bg.addColorStop(0.55, '#1b1612'); bg.addColorStop(1, '#2a211a');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);

  // Mould dot grid: strongest in the top corners, clear in the middle where the arrow and text sit.
  for (let y = CELL / 2; y < H; y += CELL) for (let x = CELL / 2; x < W; x += CELL) {
    const qx = fbm(x / 240, y / 240), qy = fbm(x / 240 + 5.2, y / 240 + 1.3);
    const v = fbm(x / 240 + 1.9 * qx + 3, y / 240 + 1.9 * qy + 7);
    const cx = Math.min(x, W - x) / W, top = 1 - y / H;
    const mask = smooth(0.4, 0.04, cx) * smooth(0.3, 0.95, top) + 0.14;
    const k = smooth(0.42, 0.7, v) * mask * 0.82;
    const col = k < 0.5 ? mix(soil, moss, k * 2) : mix(moss, mold, (k - 0.5) * 2);
    const r = (0.1 + 0.36 * k) * CELL, a = 0.16 + 0.7 * k;
    g.fillStyle = `rgba(${col.map(Math.round).join(',')},${a})`;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }

  // The mound the icons rest on, with the scalloped edge from the site's footer soil.
  const moundTop = 268;
  g.fillStyle = '#5b4636';
  g.beginPath(); g.moveTo(0, H); g.lineTo(0, moundTop);
  for (let x = 0; x <= W; x += 22) g.quadraticCurveTo(x + 11, moundTop - 9, x + 22, moundTop);
  g.lineTo(W, H); g.closePath(); g.fill();
  // A slightly lighter band behind the icon names, so Finder's labels read in light and dark mode.
  const band = g.createLinearGradient(0, moundTop, 0, H);
  band.addColorStop(0, '#6b5341'); band.addColorStop(0.5, '#7a5f49'); band.addColorStop(1, '#5b4636');
  g.fillStyle = band; g.fillRect(0, moundTop + 4, W, H - moundTop);
  g.fillStyle = 'rgba(20,17,15,0.25)';
  for (let i = 0; i < 70; i++) { const x = hash(i, 3) * W, y = moundTop + 20 + hash(i, 9) * (H - moundTop - 24); g.beginPath(); g.arc(x, y, 0.8 + hash(i, 5) * 1.6, 0, Math.PI * 2); g.fill(); }

  // Draw the words and arrow once the brand font is in; if it never loads, still draw them in the fallback.
  Promise.race([document.fonts.load('600 16px Fredoka'), new Promise((r) => setTimeout(r, 3000))]).catch(() => {}).finally(() => {
    // "Drag Grub into Applications", in the brand voice.
    g.textAlign = 'center';
    g.fillStyle = '#f3ede4';
    g.font = '600 19px Fredoka';
    g.fillText('Drag Grub into Applications', W / 2, 62);
    g.fillStyle = '#a89d90';
    g.font = '400 13px Fredoka';
    g.fillText('Then open it from your Applications folder.', W / 2, 84);

    // A hand-drawn, slightly wobbly lime arrow from Grub to Applications.
    g.strokeStyle = '#b8e34d'; g.lineWidth = 3.2; g.lineCap = 'round'; g.lineJoin = 'round';
    g.setLineDash([0.1, 9]);
    g.beginPath(); g.moveTo(258, 196); g.bezierCurveTo(300, 158, 360, 158, 402, 194); g.stroke();
    g.setLineDash([]);
    // Arrowhead along the curve's end tangent (from the last control point to the tip).
    const tip = [404, 196], ang = Math.atan2(196 - 158, 404 - 360), len = 13;
    g.beginPath();
    g.moveTo(tip[0] - len * Math.cos(ang - 0.5), tip[1] - len * Math.sin(ang - 0.5));
    g.lineTo(tip[0], tip[1]);
    g.lineTo(tip[0] - len * Math.cos(ang + 0.5), tip[1] - len * Math.sin(ang + 0.5));
    g.stroke();
    document.title = 'ready';
  });
</script>
</body>
</html>
