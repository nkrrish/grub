name: Feature request
description: Suggest something Grub should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or chore, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Grub help?
